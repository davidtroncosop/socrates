name = "socatres"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

# Crea la base con `npx wrangler d1 create socatres` y reemplaza database_id.
[[d1_databases]]
binding = "DB"
database_name = "socatres"
database_id = "5b170db4-bbdd-4471-854f-916fba37e5d5"
migrations_dir = "migrations"

# ADMIN_EMAILS (quién publica el catálogo) se configura como secreto:
#   npx wrangler pages secret put ADMIN_EMAILS --project-name=socatres
# OPENROUTER_API_KEY (revisión con IA de la foto del desarrollo) también es secreto:
#   npx wrangler pages secret put OPENROUTER_API_KEY --project-name=socatres
# Telegram (avisos diarios, resumen semanal y premios):
#   npx wrangler pages secret put TELEGRAM_BOT_TOKEN --project-name=socatres
#   npx wrangler pages secret put TELEGRAM_WEBHOOK_SECRET --project-name=socatres
#   (y define TELEGRAM_BOT_USERNAME en [vars] o como variable en Cloudflare Pages)
[vars]
VAPID_PUBLIC_KEY = "BJVGOCH1jLyYA55HxteAGsg5TLhBF_bXoEdOKs7JMtrLgUeq_DL7MYbY0o9NIeTIJVPdLB6IwgemJglO142CkKo"
APP_URL = "https://socatres.pages.dev"

# Videos de las lecciones (los genera y sube video/, ver video/README.md).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "socatres-videos"
