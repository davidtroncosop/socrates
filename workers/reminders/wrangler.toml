# Worker que envía recordatorios diarios y resúmenes semanales (Pages no ejecuta cron).
# Secretos necesarios:
#   npx wrangler secret put VAPID_PRIVATE_KEY -c workers/reminders/wrangler.toml
#   npx wrangler secret put TELEGRAM_BOT_TOKEN -c workers/reminders/wrangler.toml
name = "socatres-reminders"
main = "index.js"
compatibility_date = "2026-11-01"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "socatres"
database_id = "5b170db4-bbdd-4471-854f-916fba37e5d5"

[vars]
VAPID_SUBJECT = "https://socatres.pages.dev"
VAPID_PUBLIC_KEY = "BJVGOCH1jLyYA55HxteAGsg5TLhBF_bXoEdOKs7JMtrLgUeq_DL7MYbY0o9NIeTIJVPdLB6IwgemJglO142CkKo"
